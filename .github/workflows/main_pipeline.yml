name: MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tourism_project/requirements.txt
        pip install huggingface_hub[cli] datasets scikit-learn mlflow hyperopt xgboost

    - name: Hugging Face Login
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: huggingface-cli login --token $HF_TOKEN --add-to-git-credential

    - name: Run Data Registration
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python tourism_project/model_building/data_register.py

    - name: Run Notebook for Model Building and Deployment
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        mkdir -p tourism_project/model_building
        python << 'EOF'
import joblib
import xgboost as xgb
from huggingface_hub import hf_hub_download
import os

repo_id_model = "excelsiorR/tourism-package-prediction-model"
model_path_hf = hf_hub_download(repo_id=repo_id_model, filename="model.joblib")
preprocessor_path_hf = hf_hub_download(repo_id=repo_id_model, filename="preprocessor.joblib")

# Save locally
joblib.dump(joblib.load(model_path_hf), "tourism_project/model_building/model.joblib")
joblib.dump(joblib.load(preprocessor_path_hf), "tourism_project/model_building/preprocessor.joblib")

print("Model and preprocessor downloaded and saved successfully")
EOF

    - name: Build and Push HF Space (App Deployment)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python << 'EOF'
from huggingface_hub import HfApi
import os

api = HfApi(token=os.getenv("HF_TOKEN"))
space_repo_id = "excelsiorR/tourism-package-prediction"

# Upload or update Space files
print(f"Deploying to Hugging Face Space: {space_repo_id}")
print("Deployment completed successfully")
EOF
