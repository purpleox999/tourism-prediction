name: MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tourism_project/requirements.txt
        pip install huggingface_hub[cli] datasets scikit-learn mlflow hyperopt xgboost

    - name: Hugging Face Login
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: huggingface-cli login --token $HF_TOKEN --add-to-git-credential

    - name: Run Data Registration
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python tourism_project/model_building/data_register.py

    - name: Run Notebook for Model Building and Deployment
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # This step would typically run your model training and evaluation notebook.
        # For simplicity, we'll simulate the critical parts that generate outputs needed for deployment.
        # In a real scenario, you'd execute your notebook cells that perform training and model saving.
        # Since the model and preprocessor are already generated and registered in the previous notebook run,
        # we will ensure the files exist and then proceed with deployment artifacts.
        
        # Placeholder for model building/evaluation if not handled by a separate script
        # Ensure the model and preprocessor are available locally as expected by the next steps
        mkdir -p tourism_project/model_building
        python -c "import joblib; import xgboost as xgb; from huggingface_hub import hf_hub_download; import os;\nrepo_id_model = \"excelsiorR/tourism-package-prediction-model\";\nmodel_path_hf = [...]

    - name: Build and Push HF Space (App Deployment)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python -c "\nfrom huggingface_hub import HfApi\nimport os\n\napi = HfApi(token=os.getenv(\"HF_TOKEN\"))\nspace_repo_id = \"excelsiorR/tourism-package-prediction\"\n\n# Upload Dockerfile\na[...]
